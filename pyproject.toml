[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getyoutubetranscript"
version = "0.2.1"
description = "Python SDK for the GetYouTubeTranscript REST API - transcripts, search, channels, and playlists"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tubeagentkit" }]
keywords = ["youtube", "transcript", "youtube-api", "api-client", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://getyoutubetranscript.com"
Documentation = "https://getyoutubetranscript.com/docs"
Repository = "https://github.com/tubeagentkit/youtube-transcript-api-python"
"Bug Tracker" = "https://github.com/tubeagentkit/youtube-transcript-api-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/getyoutubetranscript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
