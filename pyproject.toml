[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getyoutubetranscript"
version = "0.3.1"
description = "YouTube transcript API for Python: get YouTube video transcripts, captions and subtitles with timestamps, search YouTube, and list channel and playlist videos. No proxies or headless browser."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tubeagentkit" }]
keywords = [
    "youtube", "youtube-transcript", "youtube-transcripts", "youtube-transcript-api", "transcript", "transcripts",
    "captions", "subtitles", "youtube-captions", "youtube-subtitles", "timestamps", "youtube-api", "youtube-search",
    "srt", "webvtt", "vtt", "cli",
    "llm", "rag", "ai", "api-client", "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.scripts]
getyoutubetranscript = "getyoutubetranscript.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://getyoutubetranscript.com"
Documentation = "https://getyoutubetranscript.com/docs"
Repository = "https://github.com/tubeagentkit/youtube-transcript-api-python"
"Bug Tracker" = "https://github.com/tubeagentkit/youtube-transcript-api-python/issues"
Changelog = "https://github.com/tubeagentkit/youtube-transcript-api-python/releases"
"Get an API key" = "https://getyoutubetranscript.com/dashboard"

[tool.hatch.build.targets.wheel]
packages = ["src/getyoutubetranscript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
